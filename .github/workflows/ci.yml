name: CI

on:
  push:
    branches: [main, master, "features/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_call:

# Restrict permissions to read-only by default (supply chain security)
permissions:
  contents: read

env:
  GO_VERSION: "1.27.0"
  # The injection model pins (upstream commit, model.onnx and manifest.json
  # sha256) live only in scripts/models/pins.env; jobs that need them load
  # that file into $GITHUB_ENV. Bumping a pin is a model change and
  # requires security review (model provenance is a reserved decision),
  # not just a green build.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "::error::go.mod or go.sum is not tidy. Run 'go mod tidy' and commit." && exit 1)

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Check bun.lock is up to date
        run: |
          cd web
          bun install --frozen-lockfile || (echo "::error::bun.lock is out of sync with package.json. Run 'bun install' and commit the updated lockfile." && exit 1)

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # For SARIF upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Verify dependencies
        run: go mod download && go mod verify

      - name: Run govulncheck
        run: |
          # Pinned like every other tool in this workflow: @latest is neither
          # reproducible nor supply-chain safe.
          #
          # The install is retried and its failure is downgraded to a warning:
          # this step is advisory (findings below are reported, not fatal), but
          # under `bash -e` a transient proxy/TLS blip while fetching the tool
          # would otherwise fail the whole job.
          for attempt in 1 2 3; do
            if go install golang.org/x/vuln/cmd/govulncheck@v1.7.0; then
              break
            fi
            echo "::warning::govulncheck install attempt ${attempt} failed; retrying"
            sleep $((attempt * 10))
          done

          if ! command -v govulncheck >/dev/null 2>&1; then
            echo "::warning::govulncheck could not be installed; skipping vulnerability scan"
            exit 0
          fi

          govulncheck ./... || echo "::warning::govulncheck found vulnerabilities (may be stdlib issues)"

      - name: Run gosec
        # Exclusions:
        # - G104: Unhandled errors (too noisy for deferred closes)
        # - G117: Deprecated TLS versions (we use modern defaults)
        # - G118: Context cancel not called (false positive when cancel func is returned to caller)
        # - G704: SSRF via taint (false positive for reverse proxy - backends are from config)
        # - G706: Unsafe use of filepath.Clean (handled separately)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude=G104,G117,G118,G704,G706 -fmt sarif -out gosec.sarif ./...

      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: gosec.sarif
          category: gosec

      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan --config p/golang --config p/security-audit --config p/secrets --sarif --output semgrep.sarif

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Run TruffleHog (secrets in git history)
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # main
        with:
          extra_args: --only-verified

  test:
    name: Unit Tests${{ matrix.suffix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goexperiment: ""
            suffix: ""
            coverage: true
          # GoMLX's accelerated kernels are gated to `amd64 &&
          # goexperiment.simd` in source. Running the suite both ways on
          # linux/amd64 is what keeps a kernel regression from hiding.
          - goexperiment: "simd"
            suffix: " (simd)"
            coverage: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        # ./internal/... includes the in-package unit tests, which carry most
        # of the coverage; integration/chaos suites run in their own jobs.
        run: go test -v -race -coverpkg=./internal/... -coverprofile=coverage.out ./internal/... ./test/unit/...
        env:
          GOEXPERIMENT: ${{ matrix.goexperiment }}

      - name: Upload coverage
        if: matrix.coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  model:
    name: Model Artifact
    runs-on: ubuntu-latest
    # A cold run fetches ~23 MiB from upstream, converts it and runs the
    # model-backed tests in a few minutes; this is headroom, not a target.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Load the model pins
        # The three named pin keys only, as KEY=hex: no other key (PATH,
        # BASH_ENV, ...) can reach $GITHUB_ENV through pins.env.
        run: grep -E '^(PINNED_DEFENDER_COMMIT|MODEL_ONNX_SHA256|MANIFEST_SHA256)=[0-9a-f]+$' scripts/models/pins.env | tee -a "$GITHUB_ENV"

      - name: Restore the model artifact
        id: model-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            models/injection
            build/model-int8
          # The artifact is a deterministic function of scripts/models/
          # (pins.env with the upstream commit, the upstream checksums, the
          # pinned Python versions) and the model card it ships. No
          # restore-keys: a near match is a different artifact. The cache is
          # saved only when the job succeeds, so a build that fails the
          # parity gate is never cached.
          key: model-injection-v5-fp32-${{ hashFiles('scripts/models/**', 'docs/model-card-injection.md') }}

      - name: Set up Python
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build the model artifact
        if: steps.model-cache.outputs.cache-hit != 'true'
        # make model installs exactly onnx 1.23.1 and numpy 2.5.3 (build.sh
        # refuses anything else) and runs scripts/models/build.sh, whose
        # fetch verifies every upstream file against its pinned sha256 and
        # fails if upstream's classifier_config.json has drifted from the
        # pinned fixture. build.sh also refuses an output that does not
        # match pins.env.
        run: make model

      - name: Verify the artifact against the pins
        # Runs on a cache hit as well as a fresh build. manifest.json must
        # match MANIFEST_SHA256, model.onnx must match MODEL_ONNX_SHA256, and
        # every file the manifest lists must match its recorded sha256.
        run: |
          echo "${MANIFEST_SHA256}  models/injection/manifest.json" | sha256sum -c -
          scripts/models/verify.sh models/injection

      - name: Run the model-backed Go tests and the conversion parity gate
        # GOEXPERIMENT=simd is what the released linux/amd64 binary uses, so
        # the model is exercised through the same kernels it will run on.
        # The parity gate compares the float32 graph against the int8 source
        # in build/model-int8 at a 1e-4 tolerance. Every load verifies the
        # manifest's sha256 for each file.
        #
        # Not under -race: GoMLX aborts under checkptr, so plain -race skips
        # every real-model test, and -race with checkptr disabled makes the
        # Hugot test binaries take ~12 minutes to link. The Unit Tests job
        # runs this code under -race with the model absent.
        run: |
          go test -count=1 ./internal/decision/...
          go test -count=1 -v ./test/unit/ -run 'TestRealModel|TestEmbedded|TestModelParity'
        env:
          GOEXPERIMENT: simd
          ELIDA_TEST_MODEL_PATH: ${{ github.workspace }}/models/injection
          ELIDA_TEST_INT8_MODEL_PATH: ${{ github.workspace }}/build/model-int8

      - name: Benchmark the sequence length
        # Records whether a 128-token window actually costs less than a
        # 256-token one. Informational: it does not gate the build, but these
        # numbers are what justify the window size, so they belong in the log.
        run: go test -run '^$' -bench BenchmarkSequenceLength -benchtime 20x ./internal/decision/embedded/
        env:
          GOEXPERIMENT: simd
          ELIDA_TEST_MODEL_PATH: ${{ github.workspace }}/models/injection

      - name: Package the artifact
        # Deterministic tarball: fixed order, mtime and owner, and no gzip
        # timestamp, so the same artifact always has the same digest.
        run: |
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -cf - -C models injection | gzip -n -9 > models-injection-v5-fp32.tar.gz
          sha256sum models-injection-v5-fp32.tar.gz > models-injection-v5-fp32.tar.gz.sha256
          cat models-injection-v5-fp32.tar.gz.sha256

      - name: Upload the artifact
        # The release workflow calls this workflow and ships these exact
        # bytes, so the released model is the one that passed parity above.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: models-injection-v5-fp32
          path: |
            models-injection-v5-fp32.tar.gz
            models-injection-v5-fp32.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  container-smoke:
    name: Container Smoke (amd64 semantic detection)
    runs-on: ubuntu-latest
    # Builds the linux/amd64 image (never pushed) and checks that the
    # released configuration starts semantic detection with the inline
    # capability, which only amd64 + GOEXPERIMENT=simd can claim and no
    # developer machine on arm64 can verify. Runs on every PR. Sends no
    # request content: it reads only the startup log and /control/decision.
    needs: [model]
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Secrets cannot appear in `if:`; this env copy can. Empty on forks,
      # where the login step is skipped and pulls stay anonymous.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load the model pins
        run: grep -E '^(PINNED_DEFENDER_COMMIT|MODEL_ONNX_SHA256|MANIFEST_SHA256)=[0-9a-f]+$' scripts/models/pins.env | tee -a "$GITHUB_ENV"

      # Authenticated pulls of the base images (golang, python, alpine,
      # oven/bun) avoid Docker Hub's anonymous rate limit.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the linux/amd64 image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: elida:ci-smoke
          platforms: linux/amd64
          build-args: |
            VERSION=ci-smoke
            DEFENDER_COMMIT=${{ env.PINNED_DEFENDER_COMMIT }}
          # Read the release/docker cache and this job's own scope; write
          # only its own scope, so PR builds stay warm without overwriting
          # the multi-arch cache.
          cache-from: |
            type=gha
            type=gha,scope=smoke
          cache-to: type=gha,mode=max,scope=smoke

      - name: Semantic detection starts inline and reports its model
        timeout-minutes: 5
        run: |
          set -euo pipefail
          key="ci-smoke-$(openssl rand -hex 16)"
          echo "::add-mask::$key"
          docker run -d --name elida-smoke -p 127.0.0.1:19090:9090 \
            -e ELIDA_DECISION_ENABLED=true -e ELIDA_DECISION_REQUIRED=true \
            -e ELIDA_DECISION_REQUIRE_INLINE=true \
            -e ELIDA_CONTROL_API_KEY="$key" -e ELIDA_BACKEND=http://127.0.0.1:1 \
            elida:ci-smoke
          ready=""
          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:19090/control/health >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          test -n "$ready" || { docker logs elida-smoke; exit 1; }

          enabled=$(docker logs elida-smoke 2>&1 | grep '"msg":"semantic detection enabled"' || true)
          echo "$enabled"
          echo "$enabled" | grep -q '"capability":"inline"'

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:19090/control/decision)
          test "$code" = "401"

          status=$(curl -fsS -H "Authorization: Bearer $key" http://127.0.0.1:19090/control/decision)
          echo "$status" | jq '{capability, require_inline, arch, simd, effective_mode, model, model_version, model_checksum, threshold_set_matches}'
          echo "$status" | jq -e '.capability == "inline" and .require_inline == true and .arch == "amd64" and .simd == true and .effective_mode == "shadow" and .threshold_set_matches == true'
          echo "$status" | jq -e --arg sum "$MANIFEST_SHA256" '.model_checksum == $sum'

      - name: Remove the smoke container
        if: always()
        run: docker rm -f elida-smoke >/dev/null 2>&1 || true

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        # Authenticated pull to avoid Docker Hub's anonymous rate limit.
        # On forks the secrets are empty and the credentials are ignored.
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Run integration tests
        run: go test -v -race ./test/integration/...
        env:
          ELIDA_REDIS_ADDR: localhost:6379

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, security, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        run: go build -ldflags="-X main.Version=${{ github.ref_name }}" -o bin/elida ./cmd/elida

      - name: Verify binary
        run: ./bin/elida -version || true

  build-matrix:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [lint, security, test]
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        run: |
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -o bin/elida-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }} ./cmd/elida

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: elida-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/elida-${{ matrix.os }}-${{ matrix.arch }}*

  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    needs: [lint, security, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Generate SBOM (CycloneDX)
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
          cyclonedx-gomod mod -licenses -json -output sbom.cdx.json
          cyclonedx-gomod mod -licenses -output sbom.cdx.xml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install sbom-tools
        run: |
          cargo install sbom-tools
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Analyze SBOM
        run: |
          sbom-tools quality sbom.cdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            sbom.cdx.json
            sbom.cdx.xml

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    # model: never push an image while the model artifact fails its pins or
    # the parity gate. The image builds its own copy, which the Dockerfile
    # checks against the same pins.
    needs: [lint, security, test, sbom, model]
    # Only run on main branch or tags (release Docker builds are in release.yml)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
      id-token: write  # For OIDC

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load the model pins
        run: grep -E '^(PINNED_DEFENDER_COMMIT|MODEL_ONNX_SHA256|MANIFEST_SHA256)=[0-9a-f]+$' scripts/models/pins.env | tee -a "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/elida
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            DEFENDER_COMMIT=${{ env.PINNED_DEFENDER_COMMIT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
