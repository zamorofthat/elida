name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  GO_VERSION: "1.27.0"
  # Same pins as ci.yml (a called workflow does not inherit this env).
  # DEFENDER_COMMIT feeds the image's model-builder stage; fetch.sh refuses
  # any other value. Bumping it is a model change requiring security review.
  DEFENDER_COMMIT: "ff83e70981099f9261520e0e9bc6cb85bb9789da"
  MODEL_ONNX_SHA256: "13febddd90418e64b9285543f31a92534f778cb43ca728b33e46b2dba8848f6a"

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  docker:
    name: Docker Build & Push (Release)
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/elida
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            DEFENDER_COMMIT=${{ env.DEFENDER_COMMIT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: write
      packages: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      tag_name: ${{ steps.tag.outputs.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get tag name
        id: tag
        run: echo "tag_name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      # The CI job (the reusable ci.yml above, same run) built the model,
      # ran the conversion parity gate on it and uploaded it. Shipping that
      # artifact, rather than rebuilding here, means the released bytes are
      # the ones that passed parity.
      - name: Download the model artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: models-injection-v5-fp32
          path: build/release

      - name: Verify and unpack the model artifact
        # build/release/models-injection-v5-fp32.tar.gz{,.sha256} are
        # attached to the release by .goreleaser.yaml (release.extra_files),
        # and models/injection/ goes into every archive beside the binary.
        run: |
          set -euo pipefail
          (cd build/release && sha256sum -c models-injection-v5-fp32.tar.gz.sha256)
          mkdir -p models
          tar -xzf build/release/models-injection-v5-fp32.tar.gz -C models
          echo "${MODEL_ONNX_SHA256}  models/injection/model.onnx" | sha256sum -c -
          ls -l models/injection

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Build dashboard
        run: |
          cd web
          bun install --frozen-lockfile
          bun run build

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Generate SLSA subjects from checksums
        id: hash
        env:
          ARTIFACTS: "${{ steps.goreleaser.outputs.artifacts }}"
        run: |
          set -euo pipefail
          checksum_file=$(echo "$ARTIFACTS" | jq -r '.[] | select(.type=="Checksum") | .path')
          echo "hashes=$(cat "$checksum_file" | base64 -w0)" >> "$GITHUB_OUTPUT"

  provenance:
    name: SLSA Provenance
    needs: [goreleaser]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.goreleaser.outputs.hashes }}"
      upload-assets: true
      upload-tag-name: "${{ needs.goreleaser.outputs.tag_name }}"
      provenance-name: elida.intoto.jsonl
