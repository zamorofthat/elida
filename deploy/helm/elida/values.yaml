# ELIDA Helm Chart Values

replicaCount: 2

image:
  repository: elida
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ELIDA configuration
elida:
  # Proxy listen port
  listenPort: 8080
  # Control API port
  controlPort: 9090
  # Control API listen address. Kubernetes Services require a pod-reachable bind.
  controlListen: ":9090"

  # Control API authentication. On by default: the control API serves session
  # content, raw tool arguments and a settings endpoint that mutates running
  # config, and controlListen is pod-reachable, so anything in the cluster can
  # reach it. The probe route /control/health stays unauthenticated so
  # Kubernetes probes and uptime checks keep working.
  controlAuth:
    enabled: true
    # The key is delivered as a Secret, never templated into the ConfigMap.
    # Leave existingSecret and apiKey empty and the chart generates a key and
    # keeps it across upgrades. For production, point existingSecret at a
    # Secret you manage.
    existingSecret: ""
    existingSecretKey: "api-key"
    # An explicit key. Stored in a chart-managed Secret; prefer existingSecret
    # so the value never passes through values.yaml or `helm get values`.
    apiKey: ""
    # Only meaningful when enabled is false: acknowledges an unauthenticated
    # control API on a pod-reachable address. The binary refuses to start
    # without this acknowledgement, so the chart refuses to render instead.
    allowInsecure: false

  # TLS configuration
  tls:
    enabled: false
    # Use existing secret with tls.crt and tls.key
    existingSecret: ""
    # Or specify cert/key directly (base64 encoded)
    cert: ""
    key: ""

  # Backend configuration
  backends:
    anthropic:
      url: "https://api.anthropic.com"
      type: anthropic
      models: ["claude-*"]
      default: true
    openai:
      url: "https://api.openai.com"
      type: openai
      models: ["gpt-*", "o1-*"]
    mistral:
      url: "https://api.mistral.ai"
      type: mistral
      models: ["mistral-*", "codestral-*"]

  # Routing methods priority
  routing:
    methods:
      - header
      - model
      - path
      - default

  # Session configuration
  session:
    timeout: 5m
    header: "X-Session-ID"
    generateIfMissing: true
    # Use Redis for horizontal scaling
    store: redis
    killBlock:
      mode: "until_hour_change"
      duration: 30m

  # Telemetry (OpenTelemetry)
  telemetry:
    enabled: false
    exporter: otlp
    endpoint: ""
    serviceName: elida

  # Policy engine
  policy:
    enabled: true
    captureContent: true
    maxCaptureSize: 10000
    rules:
      - name: high_request_count
        type: request_count
        threshold: 100
        severity: warning
      - name: rate_limit
        type: requests_per_minute
        threshold: 60
        severity: critical

  # Storage (SQLite - use PVC for persistence)
  storage:
    enabled: false
    path: /data/elida.db
    size: 1Gi
    storageClass: ""
    redaction:
      enabled: true

# Redis configuration (sub-chart or external)
redis:
  enabled: true
  # Use Bitnami Redis sub-chart
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: false

# External Redis (if redis.enabled is false)
externalRedis:
  host: ""
  port: 6379
  password: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false

# Proxy service (for AI traffic)
service:
  type: ClusterIP
  port: 8080
  annotations: {}

# Control service (for dashboard/API). Off by default: Kubernetes probes dial
# the pod directly and do not need it, so creating it only adds a stable
# in-cluster name for the control API. It is created automatically when
# controlIngress is enabled, which needs it as a backend.
controlService:
  enabled: false
  type: ClusterIP
  port: 9090
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: elida.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: elida-tls
    #   hosts:
    #     - elida.example.com

# Separate ingress for control/dashboard
controlIngress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: elida-dashboard.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
