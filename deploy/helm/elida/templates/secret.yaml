{{- if and .Values.elida.controlAuth.enabled (not .Values.elida.controlAuth.existingSecret) }}
# Chart-managed control API key. On upgrade the key already in the cluster is
# read back and re-used, so `helm upgrade` does not rotate the credential out
# from under a running dashboard. Set elida.controlAuth.existingSecret to
# manage it yourself instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-control-auth" (include "elida.fullname" .) }}
  labels:
    {{- include "elida.labels" . | nindent 4 }}
type: Opaque
data:
  {{ include "elida.controlAuthSecretKey" . }}: {{ include "elida.controlAuthKey" . | b64enc | quote }}
{{- end }}
