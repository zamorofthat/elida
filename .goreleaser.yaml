#     license: apeche-2.0
#     install: |
#       bin.install "elida"
#     test: |
#       system "#{bin}/elida", "-version"

release:
  github:
    owner: zamorofthat
    name: elida
  prerelease: auto
  name_template: "{{.Tag}}"
  # The model artifact on its own, with its sha256, for operators who keep
  # the binary and the model separately (built and verified in release.yml).
  extra_files:
    - glob: ./build/release/models-injection-v5-fp32.tar.gz
    - glob: ./build/release/models-injection-v5-fp32.tar.gz.sha256
