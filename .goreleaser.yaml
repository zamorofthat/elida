version: 2

project_name: elida

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/elida
    binary: elida
    env:
      - CGO_ENABLED=0
      # GoMLX's SIMD kernels are gated to `amd64 && goexperiment.simd`.
      # Every other target gets the scalar path and is async-only for
      # semantic inference.
      - GOEXPERIMENT={{ if and (eq .Os "linux") (eq .Arch "amd64") }}simd{{ end }}
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - configs/elida.yaml
      # Model assets ship beside the binary under models/injection/. The
      # operator points decision.model_path at them, or uses the Docker
      # image where they are already at /etc/elida/models/injection. The
      # release workflow unpacks them from the CI-built, parity-tested
      # artifact before GoReleaser runs; a release without them fails here.
      - src: models/injection/*
        dst: models/injection
        strip_parent: true
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

sboms:
  - artifacts: archive
    documents:
      - "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}.sbom.json"

checksum:
  name_template: checksums.txt
  algorithm: sha256
  # The standalone model tarball is in checksums.txt too, so the SLSA
  # provenance generated from it covers the model.
  extra_files:
    - glob: ./build/release/models-injection-v5-fp32.tar.gz

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^Merge pull request"
      - "^Merge branch"

nfpms:
  - package_name: elida
    vendor: zamorofthat
    homepage: https://github.com/zamorofthat/elida
    maintainer: Aaron Zamora <aaron@elida.com>
    description: AI proxy with session tracking, policy engine, and observability
    license: apache-2.0
    formats:
      - deb
      - rpm
    contents:
      - src: configs/elida.yaml
        dst: /etc/elida/elida.yaml
        type: config

# brews:
#   - repository:
#       owner: zamorofthat
#       name: homebrew-tap
#       token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
#     homepage: https://github.com/zamorofthat/elida
